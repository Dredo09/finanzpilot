<!doctype html><html lang="de"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101923"><link rel="manifest" href="manifest.json"><title>FinanzPilot</title><style>
*{box-sizing:border-box}body{margin:0;background:#101923;color:#e8eef5;font:16px system-ui}main{max-width:780px;margin:auto;padding:20px 16px 100px}h1{color:#79dfb4}h2{font-size:19px}section,.panel{background:#1b2937;border-radius:16px;padding:16px;margin:12px 0}button,input,select{font:inherit;border-radius:9px;padding:11px;border:1px solid #405364;background:#233445;color:#fff}button{cursor:pointer}button.primary{background:#79dfb4;color:#10241c;font-weight:bold;border:0}input,select{width:100%;margin:5px 0 12px}label{display:block;color:#b8c8d8;font-size:14px}nav{position:fixed;bottom:0;left:0;right:0;background:#182634;display:flex;justify-content:center;gap:4px;padding:10px;overflow:auto}nav button{font-size:13px;padding:10px 7px}nav .active{color:#79dfb4;border-color:#79dfb4}.line{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:9px 0;border-bottom:1px solid #354656}.muted{color:#aabac9;font-size:13px}.big{font-size:32px;font-weight:700;color:#79dfb4}.negative{color:#ff9b9b}progress{width:100%;accent-color:#79dfb4}table{width:100%;border-collapse:collapse}td,th{text-align:right;padding:8px 3px;border-bottom:1px solid #354656}td:first-child,th:first-child{text-align:left}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(135px,1fr));gap:10px}small{color:#aabac9}a{color:#79dfb4}</style><main><h1>FinanzPilot</h1><div id="app"></div></main><nav id="nav"></nav><script>
const seed={month:new Date().toISOString().slice(0,7),cash:0,card:0,future:0,salary:0,bonus:0,base:0,annual:0,repair:0,etf:0,entries:[],budgets:{Lebensmittel:0,Tanken:0,Geschenke:0,Urlaub:0,Freizeit:0,Shopping:0,Sonstiges:0},fixed:[],goals:[]};let s;try{s=JSON.parse(localStorage.getItem('finanzpilot-v1'))||structuredClone(seed)}catch(e){s=structuredClone(seed)}let tab=localStorage.getItem('finanzpilot-v1')?'Übersicht':'Daten',edit=null;const $=id=>document.getElementById(id),eur=n=>Number(n).toLocaleString('de-DE',{style:'currency',currency:'EUR'}),esc=x=>String(x).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=x=>Number(String(x).replace(',','.')),save=()=>{try{localStorage.setItem('finanzpilot-v1',JSON.stringify(s))}catch(e){alert('Speichern fehlgeschlagen. Bitte Backup exportieren.')}},sum=(a,f)=>a.reduce((v,x)=>v+f(x),0),monthly=()=>s.entries.filter(e=>e.date.slice(0,7)===s.month),balance=()=>s.cash+sum(s.entries,e=>e.account==='Giro'?(e.type==='Einnahme'?e.amount:-e.amount):0),debt=()=>s.card+sum(s.entries,e=>e.type==='Tilgung'?-e.amount:e.account==='Kreditkarte'?(e.type==='Einnahme'?-e.amount:e.amount):0);function go(t){tab=t;edit=null;render()}function field(label,id,value,type='number'){return `<label>${label}<input id="${id}" type="${type}" ${type==='number'?'step="0.01"':''} value="${esc(value)}"></label>`}function render(){ $('nav').innerHTML=['Übersicht','Buchungen','Plan','Ziele','Daten'].map(t=>`<button class="${tab===t?'active':''}" onclick="go('${t}')">${t}</button>`).join('');let h='';if(tab==='Übersicht'){let free=balance()-debt()-s.future;h=`<section><small>Giro abzüglich Kreditkarte und restlicher Raten</small><div class="big ${free<0?'negative':''}">${eur(free)}</div><div class="line">Giro <b>${eur(balance())}</b></div><div class="line">Kreditkarte offen <b>${eur(debt())}</b></div><div class="line">Künftige Raten <b>${eur(s.future)}</b></div><p class="muted">Noch nicht fällige Fixkosten sind hier nicht abgezogen. Startwerte unter Daten prüfen.</p><button class="primary" onclick="go('Buchungen')">+ Buchung erfassen</button></section><section>${field('Budgetmonat','month',s.month,'month')}<button onclick="s.month=$('month').value;save();render()">Monat wählen</button><h2>Monatsbudgets</h2>`;for(let [k,v] of Object.entries(s.budgets)){let used=sum(monthly().filter(e=>e.category===k&&e.type==='Ausgabe'),e=>e.amount);h+=`<div class="line">${esc(k)} <b>${eur(used)} / ${eur(v)}</b></div><progress max="${Math.max(v,1)}" value="${used}"></progress><small>${eur(v-used)} übrig</small>`}h+='</section>'}if(tab==='Buchungen'){let e=edit===null?{}:s.entries[edit];h=`<section><h2>${edit===null?'Neue Buchung':'Buchung bearbeiten'}</h2>${field('Datum','date',e.date||new Date().toISOString().slice(0,10),'date')}${field('Betrag','amount',e.amount||'')}${field('Beschreibung','note',e.note||'','text')}<label>Art<select id="type">${['Ausgabe','Einnahme','Tilgung'].map(x=>`<option ${e.type===x?'selected':''}>${x}</option>`)}</select></label><label>Konto<select id="account">${['Giro','Kreditkarte'].map(x=>`<option ${e.account===x?'selected':''}>${x}</option>`)}</select></label><label>Kategorie<select id="cat">${[...Object.keys(s.budgets),'Fixkosten','Gehalt','Andere'].map(x=>`<option ${e.category===x?'selected':''}>${esc(x)}</option>`)}</select></label><small>Tilgung = Zahlung vom Giro an Kreditkarte, keine neue Ausgabe. Konto Giro wählen.</small><p><button class="primary" onclick="add()">Speichern</button></p></section><section><h2>Alle Buchungen</h2>${s.entries.map((e,i)=>`<div class="line"><div>${esc(e.note||e.category)}<br><small>${esc(e.date)} · ${esc(e.type)} · ${esc(e.account)}</small></div><b>${eur(e.amount)}</b><button onclick="edit=${i};render()">✎</button><button onclick="if(confirm('Buchung löschen?')){s.entries.splice(${i},1);edit=null;save();render()}">×</button></div>`).join('')||'Noch keine Buchungen.'}</section>`}if(tab==='Plan'){let fixed=sum(s.fixed,x=>x.amount),surplus=s.salary-fixed-s.annual-s.repair-sum(Object.values(s.budgets),x=>x);h=`<section><h2>Fixkosten pro Monat</h2>${s.fixed.map((x,i)=>`<div class="line">${esc(x.name)} <b>${eur(x.amount)}</b><button onclick="s.fixed.splice(${i},1);save();render()">×</button></div>`).join('')}${field('Neue Fixkosten','fn','','text')}${field('Betrag','fa','')}<button onclick="if($('fn').value&&num($('fa').value)>0){s.fixed.push({name:$('fn').value,amount:num($('fa').value)});save();render()}">Hinzufügen</button><p>Summe: ${eur(fixed)}</p></section><section><h2>Budgets (gewählter Monat)</h2>${Object.entries(s.budgets).map(([k,v],i)=>field(esc(k),'b'+i,v)).join('')}<button onclick="Object.keys(s.budgets).forEach((k,i)=>s.budgets[k]=Math.max(0,num($('b'+i).value)||0));save();render()">Budgets speichern</button></section><section><h2>Prognose: 12 Monate</h2><small>Unabhängiges Planszenario, keine automatische Fortschreibung der Buchungen. Startpuffer plus optionaler Bonus, danach monatlicher Überschuss nach Fixkosten, Budgets, Rücklagen und ETF. Künftige Raten werden zu Beginn vollständig reserviert.</small><p>Monatlicher Überschuss: <b>${eur(surplus)}</b></p><table><tr><th>Monat</th><th>Freie Rücklagen</th></tr>`;let v=s.base+s.bonus-s.future;for(let i=1;i<=12;i++){v+=surplus-s.etf;h+=`<tr><td>Monat ${i}</td><td>${eur(v)}</td></tr>`}h+='</table></section>'}if(tab==='Ziele'){h='<section><h2>Sparziele</h2><small>Manuelle Rücklagenübersicht, keine automatische Kontobuchung.</small>'+s.goals.map((g,i)=>`<h3>${esc(g.name)}</h3><progress max="${g.target}" value="${g.saved}"></progress><p>${eur(g.saved)} / ${eur(g.target)}</p>${field('Bereits gespart','g'+i,g.saved)}<button onclick="if(confirm('Sparziel löschen?')){s.goals.splice(${i},1);save();render()}">Löschen</button><button onclick="s.goals[${i}].saved=Math.max(0,num($('g${i}').value)||0);save();render()">Aktualisieren</button>`).join('')+`${field('Neues Sparziel','gn','','text')}${field('Zielbetrag','gt','')}<button onclick="addGoal()">Sparziel hinzufügen</button></section>`}if(tab==='Daten'){h=`<section><h2>Startwerte und Planung</h2>${[['Giro-Startsaldo','cash'],['Offene fällige Kreditkarte','card'],['Künftige Raten (nicht im Kartenbetrag)','future'],['Monatsgehalt netto','salary'],['Bonus netto (optional)','bonus'],['Startpuffer für Prognose ohne Bonus','base'],['Jährliche Rechnungen pro Monat','annual'],['Reparaturrücklage pro Monat','repair'],['ETF pro Monat','etf']].map(([l,k])=>field(l,k,s[k])).join('')}<button class="primary" onclick="settings()">Speichern</button><p class="muted">Startsaldo nicht nach jeder Buchung ändern. Künftige Raten manuell reduzieren, sobald sie als Kartenausgabe erfasst werden.</p></section><section><h2>Datensicherung</h2><button onclick="backup()">JSON exportieren</button><p><label>Backup wiederherstellen<input type="file" accept=".json" onchange="restore(this.files[0])"></label></p><small>Nur lokal gespeichert. Browserdaten löschen entfernt auch deine Daten.</small></section>`}$('app').innerHTML=h}function addGoal(){let name=$('gn').value.trim(),target=num($('gt').value);if(!name||!Number.isFinite(target)||target<=0)return alert('Bitte Name und Zielbetrag eingeben.');s.goals.push({name,target,saved:0});save();render()}function add(){let amount=num($('amount').value),date=$('date').value;if(!Number.isFinite(amount)||amount<=0||!date)return alert('Bitte gültigen Betrag und Datum eingeben.');let type=$('type').value,e={amount,date,type,account:type==='Tilgung'?'Giro':$('account').value,category:$('cat').value,note:$('note').value};if(edit===null)s.entries.push(e);else s.entries[edit]=e;edit=null;save();render()}function settings(){for(let k of ['cash','card','future','salary','bonus','base','annual','repair','etf']){let v=num($(k).value);if(!Number.isFinite(v))return alert('Ungültiger Wert');s[k]=v}save();render()}function backup(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(s,null,2)],{type:'application/json'}));a.download='finanzpilot-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}async function restore(f){if(!f)return;try{let x=JSON.parse(await f.text());if(!Array.isArray(x.entries)||!Array.isArray(x.fixed)||!Array.isArray(x.goals)||!x.budgets||!Number.isFinite(x.cash))throw Error();if(confirm('Aktuelle Daten ersetzen?')){s={...structuredClone(seed),...x};save();render()}}catch(e){alert('Ungültiges Backup')}}render();if('serviceWorker'in navigator&&location.protocol!=='file:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
